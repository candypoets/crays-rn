appId: life.crays
---
- runFlow: launch.yaml
- tapOn:
    id: "create-account-button"
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000
- tapOn:
    id: "display-name-input"
- inputText: "QA Alex"
- hideKeyboard
- tapOn:
    id: "profile-continue-button"
- extendedWaitUntil:
    visible:
      id: "tonight-find-screen"
    timeout: 30000
# Newcomer surface: warm consent truth, one honest action.
- assertVisible: "Find your room"
- assertVisible: ".*Preview it before Crays joins.*"
- assertVisible: ".*Crays ID is ready.*"
- assertVisible:
    id: "tonight-nearby"
# Internal QA/protocol language never reaches the newcomer surface.
- assertNotVisible: "Development test mode"
- assertNotVisible: ".*test relay.*"
- assertNotVisible: "Map and search are not configured"
# QR, map, and Nearby are independent choices.
- assertVisible:
    id: "tonight-map"
    enabled: true
- assertVisible:
    id: "tonight-scan"
    enabled: true
# Camera permission is still untouched until the scanner's explicit action.
- tapOn:
    id: "tonight-scan"
- extendedWaitUntil:
    visible:
      id: "room-qr-scanner-screen"
    timeout: 15000
- assertVisible: "Camera only when you choose"
- assertVisible:
    id: "request-camera"
- tapOn:
    id: "qr-back"
- extendedWaitUntil:
    visible:
      id: "tonight-find-screen"
    timeout: 15000
# The newcomer's one action explains Nearby before any permission prompt.
- tapOn:
    id: "tonight-nearby"
- extendedWaitUntil:
    visible:
      id: "bluetooth-rationale-screen"
    timeout: 15000
- assertVisible: ".*do not publish your presence or exact location.*"
- tapOn:
    id: "use-map-button"
- extendedWaitUntil:
    visible:
      id: "tonight-find-screen"
    timeout: 15000
- assertVisible: "Find your room"
- takeScreenshot: 27-discover-handoff

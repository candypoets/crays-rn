    timeout: 15000
- assertVisible: "Total"
- assertVisible: "€12.00"
- assertVisible: "Payments are intentionally not connected in this pilot. No charge or venue order will be created from this build."
- assertVisible:
    id: "place-order-disabled"
- takeScreenshot: 14-review-pay-relay

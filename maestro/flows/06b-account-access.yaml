appId: life.crays
---
- runFlow: launch.yaml
- tapOn:
    id: "create-account-button"
- assertVisible:
    id: "account-access-screen"
- assertVisible: "Make a Crays identity"
- assertVisible: "Create on this device"
- assertNotVisible: "Continue with Apple"
- assertNotVisible: "Continue with Google"
- takeScreenshot: 06b-account-access
# The existing-account action is implemented (screen 09): it opens the
# returning-login screen via router.replace, so Back returns to the cold
# welcome; re-enter account access from there.
- tapOn:
    id: "existing-account-button"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- assertVisible: "Bring the identity you already use."
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "cold-welcome-screen"
    timeout: 15000
- tapOn:
    id: "create-account-button"
- extendedWaitUntil:
    visible:
      id: "account-access-screen"
    timeout: 15000
- doubleTapOn:
    id: "create-on-device-button"
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000

appId: life.crays
---
- runFlow: seed-and-join.yaml
- tapOn:
    id: "room-people-tab"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 15000
- tapOn: "Open Jonas profile and safety actions"
- extendedWaitUntil:
    visible:
      id: "first-contact-screen"
    timeout: 15000
- assertVisible: "Message Jonas"
- assertVisible: "Send a drink"
- assertVisible: ".*A drink is never anonymous.*"
- tapOn:
    id: "first-contact-more"
- scrollUntilVisible:
    element:
      id: "person-report"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "person-report"
- extendedWaitUntil:
    visible: "Report sent to this venue."
    timeout: 15000
- takeScreenshot: 02-first-contact-relay

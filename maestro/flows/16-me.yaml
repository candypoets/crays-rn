appId: life.crays
---
- runFlow: seed-and-join.yaml
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- assertVisible: "${QA_PROFILE_NAME}"
- assertVisible: "Your Crays identity"
- assertVisible: "Saved in Crays"
- tapOn:
    id: "me-account-profile"
- assertVisible: "Public identity"
- assertVisible: "${QA_PROFILE_NPUB}"
- assertVisible: "Saved on this device"
- assertNotVisible: ".*nsec1.*"
- tapOn:
    id: "me-account-profile"
- tapOn:
    id: "me-notifications"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible: "Notifications"
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- assertVisible: "Active order"
- assertVisible: "Current room"
- assertVisible: "Ready for pickup"
- assertVisible: "1 saved ticket"
- assertNotVisible: "CR-QA-READY"
- assertNotVisible: ".*relay-confirmed.*"
- tapOn:
    id: "me-current-room"
- extendedWaitUntil:
    visible:
      id: "room-menu-screen"
    timeout: 15000
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "me-wallet"
    direction: DOWN
    timeout: 8000
- assertVisible: "Orders"
- assertVisible: "Memberships & passes"
- assertVisible: "Wallet"
- assertVisible: "Messages"
- takeScreenshot: 16-me-relay

appId: life.crays
---
- runFlow: seed-and-join.yaml
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- assertVisible: "${QA_PROFILE_NAME}"
- assertVisible: "Your Crays identity"
- assertVisible: "Saved in Crays"
- tapOn:
    id: "me-account-profile"
- assertVisible: "Public identity"
- assertVisible: "${QA_PROFILE_NPUB}"
- assertVisible: "Saved on this device"
- assertNotVisible: ".*nsec1.*"
- tapOn:
    id: "me-account-profile"
- tapOn:
    id: "me-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible: "Notifications"
- tapOn:
    id: "settings-back"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- assertNotVisible: "Active order"
- assertNotVisible: "Current room"
- assertNotVisible: "Ready for pickup"
- assertVisible: "1 saved ticket"
- assertNotVisible: "CR-QA-READY"
- assertNotVisible: ".*relay-confirmed.*"
- scrollUntilVisible:
    element:
      id: "me-orders"
    direction: DOWN
    timeout: 8000
- assertVisible: "Order history"
- assertVisible: "Memberships"
- assertVisible: "Passes"
- assertVisible: "Recovery options"
- takeScreenshot: 16-me-relay

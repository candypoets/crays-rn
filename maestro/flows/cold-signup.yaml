appId: life.crays
---
- runFlow: launch.yaml
- assertVisible:
    id: "cold-welcome-screen"
- tapOn:
    id: "create-account-button"
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000
- tapOn:
    id: "display-name-input"
- inputText: "QA Alex"
- hideKeyboard
- tapOn:
    id: "profile-continue-button"
- extendedWaitUntil:
    visible:
      id: "tonight-find-screen"
    timeout: 30000
- assertVisible: "Find your room"
- assertVisible: ".*Crays ID is ready.*"
- takeScreenshot: cold-signup-complete

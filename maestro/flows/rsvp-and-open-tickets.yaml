appId: life.crays
---
- runFlow: seed-and-join.yaml
- openLink: "crays:///event?id=${EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-screen"
    timeout: 30000
- tapOn:
    id: "event-rsvp"
- extendedWaitUntil:
    visible: "Going · RSVP sent"
    timeout: 30000
- openLink: "crays:///tickets"
- extendedWaitUntil:
    visible:
      id: "tickets-screen"
    timeout: 30000
# The tickets screen groups confirmed RSVPs under an "RSVPs" section title.
- assertVisible: "RSVPs"
- assertVisible: "Rooftop Jazz"
- assertVisible: ".*The Skyline Room.*"

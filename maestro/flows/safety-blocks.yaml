appId: life.crays
---
- runFlow: seed-and-join.yaml
- tapOn:
    id: "room-people-tab"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 15000
- tapOn: "Jonas"
- extendedWaitUntil:
    visible:
      id: "first-contact-screen"
    timeout: 15000
- tapOn:
    id: "first-contact-more"
- scrollUntilVisible:
    element:
      id: "person-block-global"
    direction: DOWN
- tapOn:
    id: "person-block-global"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 15000
- assertNotVisible: "Jonas"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "room-menu-screen"
    timeout: 30000
- tapOn:
    id: "room-people-tab"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 15000
- assertNotVisible: "Jonas"
- tapOn:
    id: "tab-me"
- tapOn:
    id: "me-profile"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Blocked everywhere"
    direction: DOWN
- assertVisible: "Jonas"
- tapOn:
    id: "unblock-${JONAS_PUBKEY}-global"
- assertVisible: "Unblock Jonas everywhere?"
- tapOn: "Unblock"
- extendedWaitUntil:
    visible: "Nobody is blocked"
    timeout: 15000
- tapOn:
    id: "settings-back"
- tapOn:
    id: "tab-room"
- extendedWaitUntil:
    visible: "Jonas"
    timeout: 15000
- tapOn: "Jonas"
- scrollUntilVisible:
    element:
      id: "person-hide-room"
    direction: DOWN
- tapOn:
    id: "person-hide-room"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 15000
- assertNotVisible: "Jonas"
- tapOn:
    id: "tab-me"
- tapOn:
    id: "me-profile"
- scrollUntilVisible:
    element:
      text: "Hidden in room.*"
    direction: DOWN
- assertVisible: "Hidden in room.*"
- tapOn:
    id: "unblock-${JONAS_PUBKEY}-venue"
- assertVisible: "Unblock Jonas in this room?"
- tapOn: "Unblock"
- assertVisible: "Nobody is blocked"
- takeScreenshot: safety-block-scopes

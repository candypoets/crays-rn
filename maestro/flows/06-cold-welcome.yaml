appId: life.crays
---
- runFlow: launch.yaml
- assertVisible:
    id: "cold-welcome-screen"
- assertVisible:
    id: "cold-welcome-heading"
- assertVisible: "Built for real rooms"
- assertVisible: "Verified rooms"
- assertNotVisible: "Gallery Opening"
- assertNotVisible: "Rooftop Jazz"
- assertNotVisible: "After Hours"
- assertVisible: "Create my Crays ID"
- assertVisible: "Use an existing Nostr ID"
- assertVisible: ".*No public location.*"
- takeScreenshot: 06-cold-welcome
# Log in is implemented (screen 09): it navigates to the returning-login
# screen, which on a clean device reports there is no local account.
- tapOn:
    id: "log-in-button"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- assertVisible: "Pick up where you left off."
- assertVisible: "No account on this device"
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "cold-welcome-screen"
    timeout: 15000
- tapOn:
    id: "create-account-button"
- assertVisible:
    id: "profile-setup-screen"

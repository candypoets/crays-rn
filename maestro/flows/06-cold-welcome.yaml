appId: life.crays
---
- runFlow: launch.yaml
- assertVisible:
    id: "cold-welcome-screen"
- assertVisible:
    id: "cold-welcome-heading"
- assertVisible: "Create account"
- assertVisible: "Log in"
- assertVisible: ".*No public location.*"
- takeScreenshot: 06-cold-welcome
- tapOn:
    id: "log-in-button"
- assertVisible: "Login comes next"
- assertVisible: ".*Existing-account recovery.*"
- tapOn: "OK"
- tapOn:
    id: "create-account-button"
- assertVisible:
    id: "account-access-screen"

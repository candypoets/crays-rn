appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- openLink: "crays:///join-room?relay=${RELAY_URL}&room=${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "The Skyline Room"
    timeout: 45000
- extendedWaitUntil:
    visible: "Browse quietly"
    timeout: 15000
- tapOn:
    id: "visibility-quiet"
- extendedWaitUntil:
    visible: "Enter room"
    timeout: 15000
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- tapOn:
    id: "room-menu"
- extendedWaitUntil:
    visible:
      id: "room-menu-screen"
    timeout: 15000
- extendedWaitUntil:
    visible: "Mezcal Negroni"
    timeout: 15000

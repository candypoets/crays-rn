      id: "add-funds-screen"
    timeout: 15000
- assertVisible: "Lightning funding is not configured"
- assertVisible: "Mint configuration required"
- assertVisible: "No invoice, QR code, token, or spendable balance is created on this screen."
- takeScreenshot: 26-add-funds-unconfigured

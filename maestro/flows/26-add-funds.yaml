appId: life.crays
---
- runFlow: 25-wallet.yaml
- scrollUntilVisible:
    element:
      id: "wallet-add-funds"
    direction: UP
    timeout: 8000
- tapOn:
    id: "wallet-add-funds"
- extendedWaitUntil:

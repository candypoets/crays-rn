appId: life.crays
---
# Shared setup: launch the development client, connect it directly to Metro on
# 8085, and wait for the Crays bundle. Expo 57 may show only discovered-server
# rows and no editable URL field, so use the app's development-client link
# instead of depending on launcher layout. Keep Metro out of CI mode so bundle
# freshness matches the known-good nuts-rn setup.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- openLink: "exp+crays://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8085"
# This development client is built with skipOnboarding/showMenuAtLaunch off;
# waiting for optional launcher overlays adds tens of seconds to every screen
# scenario and can accidentally target Android system UI.
- extendedWaitUntil:
    visible:
      id: "cold-welcome-screen"
    timeout: 180000

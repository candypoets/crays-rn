appId: life.crays
---
# Shared setup: launch the development client, connect it to Metro on 8085,
# and wait for the Crays bundle. Keep Metro out of CI mode so discovery and
# fresh-bundle behavior match the known-good nuts-rn setup.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- runFlow:
    when:
      visible: "New development server"
    commands:
      - tapOn: "New development server"
- extendedWaitUntil:
    visible: "(exp|http)://"
    timeout: 20000
- tapOn: "(exp|http)://"
- inputText: "exp://localhost:8085"
# Expo 57's launcher submits this URI through the field's native Go action; it
# no longer renders the older Connect button on the tablet layout.
- pressKey: ENTER
# This development client is built with skipOnboarding/showMenuAtLaunch off;
# waiting for optional launcher overlays adds tens of seconds to every screen
# scenario and can accidentally target Android system UI.
- extendedWaitUntil:
    visible:
      id: "cold-welcome-screen"
    timeout: 180000

appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}&next=test-room&service=${SERVICE_URL}&relay=${RELAY_URL}&room=${ROOM_ID}&token=${INVITE_TOKEN}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- extendedWaitUntil:
    visible:
      id: "dev-test-room-card"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Crays Test Room is online.*"
    timeout: 30000
- assertVisible: ".*Bluetooth is not required.*"
- tapOn:
    id: "open-test-room"
- extendedWaitUntil:
    visible:
      id: "room-preview-screen"
    timeout: 30000
- assertVisible: "Direct links, Map and QR entry do not require Bluetooth."
- tapOn:
    id: "enter-room-button"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 15000
- assertNotVisible:
    id: "bluetooth-rationale-screen"
- tapOn:
    id: "visibility-visible"
- tapOn:
    id: "intent-${QA_JOIN_INTENT}"
- tapOn:
    id: "join-context-input"
- inputText: "${QA_JOIN_CONTEXT}"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "leave-after-60"
    direction: DOWN
- tapOn:
    id: "leave-after-60"
- scrollUntilVisible:
    element:
      id: "join-room-button"
    direction: DOWN
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-menu-screen"
    timeout: 30000
- assertVisible:
    id: "menu-screen"
- assertVisible: "Mezcal Negroni"
- tapOn:
    id: "room-people-tab"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 15000
- assertVisible: "Maya"
- assertVisible: "Jonas"
- assertVisible: "${QA_PROFILE_NAME}"
- assertVisible: "${QA_JOIN_INTENT}"
- assertVisible: ".*${QA_JOIN_CONTEXT}.*"
- assertVisible: "^Discover$"
- assertVisible: "^Messages$"
- assertVisible: "^Me$"
- takeScreenshot: test-build-room-visible-invite
- tapOn: "Jonas"
- extendedWaitUntil:
    visible:
      id: "first-contact-screen"
    timeout: 15000
- tapOn:
    id: "message-person"
- extendedWaitUntil:
    visible:
      id: "message-request-screen"
    timeout: 15000
- tapOn: "${QA_MESSAGE_REQUEST_TEXT}"
- tapOn:
    id: "send-message-request"
- extendedWaitUntil:
    visible: "Request sent"
    timeout: 15000
- takeScreenshot: test-build-room-message-request
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "room-menu-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Mezcal Negroni"
    timeout: 15000
- tapOn:
    id: "room-people-tab"
- extendedWaitUntil:
    visible: "Maya"
    timeout: 15000
- assertVisible: "Jonas"
- tapOn:
    id: "room-feed-tab"
- extendedWaitUntil:
    visible: "The mezcal negroni is excellent."
    timeout: 15000
- assertVisible: "Connected in the room"
- takeScreenshot: test-build-room-cold-resume

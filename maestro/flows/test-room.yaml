appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}&next=test-room&service=${SERVICE_URL}&relay=${RELAY_URL}&room=${ROOM_ID}&token=${INVITE_TOKEN}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- extendedWaitUntil:
    visible:
      id: "dev-test-room-card"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Crays Test Room is online.*"
    timeout: 30000
- assertVisible: ".*Bluetooth is not required.*"
- tapOn:
    id: "open-test-room"
- extendedWaitUntil:
    visible:
      id: "room-preview-screen"
    timeout: 30000
- tapOn:
    id: "enter-room-button"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 15000
- assertNotVisible:
    id: "bluetooth-rationale-screen"
- tapOn:
    id: "visibility-visible"
- tapOn:
    id: "intent-${QA_JOIN_INTENT}"
- tapOn:
    id: "join-context-input"
- inputText: "${QA_JOIN_CONTEXT}"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "leave-after-60"
    direction: DOWN
- tapOn:
    id: "leave-after-60"
- scrollUntilVisible:
    element:
      id: "join-room-button"
    direction: DOWN
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- assertVisible: "Maya"
- assertVisible: "Jonas"
- assertVisible: "${QA_PROFILE_NAME}"
- assertVisible: "${QA_JOIN_INTENT}"
- assertVisible: "${QA_JOIN_CONTEXT}"
- takeScreenshot: test-build-room-visible-invite

appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}&testRelay=${TEST_ROOM_RELAY_URL}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- extendedWaitUntil:
    visible:
      id: "dev-test-room-card"
    timeout: 30000
- extendedWaitUntil:
    visible: "Crays Test Room is online"
    timeout: 30000
- tapOn:
    id: "open-test-room"
- extendedWaitUntil:
    visible:
      id: "room-preview-screen"
    timeout: 30000
- assertVisible: "Direct links, Map and QR entry do not require Bluetooth."
- tapOn:
    id: "enter-room-button"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 15000
- assertNotVisible:
    id: "bluetooth-rationale-screen"
- tapOn:
    id: "visibility-quiet"
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- assertVisible: "Maya"
- assertVisible: "Jonas"
- takeScreenshot: development-test-room

appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}&next=test-room&service=${SERVICE_URL}&relay=${RELAY_URL}&room=${ROOM_ID}&token=${INVITE_TOKEN}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- extendedWaitUntil:
    visible:
      id: "tonight-find-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Crays Test Room"
    timeout: 30000
- tapOn:
    id: "room-result-card"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- assertVisible: "Preview only · you are not inside yet"
- assertNotVisible:
    id: "bluetooth-rationale-screen"
- tapOn:
    id: "visibility-visible"
- tapOn:
    id: "intent-${QA_JOIN_INTENT}"
- tapOn:
    id: "join-context-input"
- inputText: "${QA_JOIN_CONTEXT}"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "leave-after-60"
    direction: DOWN
- tapOn:
    id: "leave-after-60"
- scrollUntilVisible:
    element:
      id: "join-room-button"
    direction: DOWN
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- assertVisible: "Maya"
- assertVisible: "Jonas"
- assertVisible: "${QA_PROFILE_NAME}"
- assertVisible: "${QA_JOIN_INTENT}"
- assertVisible: ".*${QA_JOIN_CONTEXT}.*"
- assertVisible: "^Tonight$"
- assertVisible: "^Messages$"
- assertVisible: "^Me$"
- takeScreenshot: test-build-room-visible-invite
- tapOn: "Jonas"
- extendedWaitUntil:
    visible:
      id: "message-request-screen"
    timeout: 15000
- tapOn: "${QA_MESSAGE_REQUEST_TEXT}"
- tapOn:
    id: "send-message-request"
- extendedWaitUntil:
    visible: "Waiting for Jonas"
    timeout: 15000
- takeScreenshot: test-build-room-message-request
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Maya"
    timeout: 15000
- assertVisible: "Jonas"
- tapOn:
    id: "room-feed-tab"
- extendedWaitUntil:
    visible: "The mezcal negroni is excellent."
    timeout: 15000
- assertVisible: "Connected in the room"
- takeScreenshot: test-build-room-cold-resume

appId: life.crays
---
- runFlow: seed-and-join.yaml
- openLink: "crays:///membership-detail?awardId=${MEMBERSHIP_AWARD_ID}"
- extendedWaitUntil:
    visible:
      id: "membership-detail-screen"
    timeout: 15000
- assertVisible: "Active"
- assertVisible: "Present membership"
- assertVisible:
    id: "entitlement-presentation"
- assertVisible: "Live code · refreshes automatically · tap to enlarge"
- scrollUntilVisible:
    element:
      text: "No benefit uses recorded yet.*"
    direction: DOWN
- assertVisible: "No benefit uses recorded yet.*"
- takeScreenshot: 19-membership-detail-relay

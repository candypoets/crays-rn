appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- openLink: "crays:///join-room?relay=${RELAY_A_URL}&room=${ROOM_A_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "The Skyline Room"
    timeout: 45000
- tapOn:
    id: "visibility-visible"
# Selecting visible reveals the intent/context fields and pushes the enter
# button below the fold; scroll it back into view before tapping.
- scrollUntilVisible:
    element:
      id: "join-room-button"
    direction: DOWN
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- openLink: "crays:///switch-room?relay=${RELAY_B_URL}&room=${ROOM_B_ID}"
- extendedWaitUntil:
    visible:
      id: "switch-room-screen"
    timeout: 30000
- assertVisible: "You are in"
- assertVisible: "You’re entering"
- assertVisible: "Leave and enter new room"
- tapOn:
    id: "switch-room-confirm"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "The Moonlight Room"
    timeout: 45000
- assertVisible: "Browse quietly"
- scrollUntilVisible:
    element:
      text: ".*No presence event is published.*"
    direction: DOWN
- assertVisible: ".*No presence event is published.*"
- takeScreenshot: 28-switch-room-two-identities

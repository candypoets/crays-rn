appId: life.crays
---
- runFlow: launch.yaml
- tapOn:
    id: "create-account-button"
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000
- assertVisible: "What should people here call you?"
- assertVisible:
    id: "display-name-input"
- tapOn:
    id: "display-name-input"
- inputText: "QA Alex"
- hideKeyboard
- assertVisible: "QA Alex"
- takeScreenshot: 07-account-setup
- tapOn:
    id: "profile-continue-button"
- extendedWaitUntil:
    visible:
      id: "tonight-find-screen"
    timeout: 30000

appId: life.crays
---
# ${QA_MESSAGE_REQUEST_TEXT} is supplied by .qa/relay-screen-scenario.mjs from
# .qa/flow-fixtures.mjs; standalone runs need `-e` overrides. The "22/240"
# counter assertion assumes the default 22-character fixture text.
- runFlow: seed-and-join.yaml
- tapOn: "Jonas"
- extendedWaitUntil:
    visible:
      id: "first-contact-screen"
    timeout: 15000
- tapOn:
    id: "message-person"
- extendedWaitUntil:
    visible:
      id: "message-request-screen"
    timeout: 15000
- tapOn:
    id: "message-request-input"
- inputText: "${QA_MESSAGE_REQUEST_TEXT}"
- hideKeyboard
- assertVisible: "22/240"
- tapOn:
    id: "send-message-request"
- extendedWaitUntil:
    visible: "Request sent"
    timeout: 15000
# The person screen is pushed over the tab shell, so the tab bar is not
# reachable here; deep-link to the messages tab instead of navigating back.
- openLink: "crays:///messages"
- extendedWaitUntil:
    visible:
      id: "messages-screen"
    timeout: 15000
- assertVisible: "Jonas"
- assertVisible: "waiting"
- assertVisible: "${QA_MESSAGE_REQUEST_TEXT}"
- tapOn:
    id: "tab-room"
- tapOn: "Jonas"
- extendedWaitUntil:
    visible: "Waiting for a response"
    timeout: 15000
- tapOn:
    id: "message-person"
- assertVisible:
    id: "first-contact-screen"
- takeScreenshot: messages-home-relay

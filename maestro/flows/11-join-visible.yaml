appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- openLink: "crays:///join-room?relay=${RELAY_URL}&room=${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- tapOn:
    id: "visibility-visible"
- tapOn:
    id: "intent-business"
- tapOn:
    id: "join-context-input"
- inputText: "Here for the founders meetup"
- pressKey: ENTER
- scrollUntilVisible:
    element:
      id: "leave-after-60"
    direction: DOWN
- tapOn:
    id: "leave-after-60"
- scrollUntilVisible:
    element:
      id: "join-room-button"
    direction: DOWN
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Maya QA"
    timeout: 15000
- assertVisible: "business"
- assertVisible: "Here for the founders meetup"
- takeScreenshot: 11-join-visible-presence

appId: life.crays
---
# ${QA_JOIN_INTENT} and ${QA_JOIN_CONTEXT} are supplied by
# .qa/relay-screen-scenario.mjs from .qa/flow-fixtures.mjs; standalone runs
# need `-e QA_JOIN_INTENT=... -e QA_JOIN_CONTEXT=...`.
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- openLink: "crays:///join-room?relay=${RELAY_URL}&room=${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Joining · The Skyline Room"
    timeout: 45000
- tapOn:
    id: "visibility-visible"
- tapOn:
    id: "intent-${QA_JOIN_INTENT}"
- tapOn:
    id: "join-context-input"
- inputText: "${QA_JOIN_CONTEXT}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "leave-after-60"
    direction: DOWN
- tapOn:
    id: "leave-after-60"
- scrollUntilVisible:
    element:
      id: "join-room-button"
    direction: DOWN
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- assertVisible: "Maya"
- assertVisible: "Jonas"
- extendedWaitUntil:
    visible: "Maya QA"
    timeout: 15000
- assertVisible: "${QA_JOIN_INTENT}"
- tapOn: "Maya QA"
- extendedWaitUntil:
    visible:
      id: "first-contact-screen"
    timeout: 15000
- assertVisible: "${QA_JOIN_CONTEXT}"
- takeScreenshot: 11-join-visible-presence

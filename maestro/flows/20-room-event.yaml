appId: life.crays
---
- runFlow: seed-and-join.yaml
- openLink: "crays:///event?id=${EVENT_ID}"
- extendedWaitUntil:
    visible:
      id: "event-screen"
    timeout: 15000
- assertVisible: "Rooftop Jazz"
- assertVisible: "Free RSVP"
- tapOn:
    id: "event-rsvp"
- extendedWaitUntil:
    visible: "Going · RSVP sent"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Preview only · ticket credential not configured"
    direction: DOWN
- assertVisible: "Preview only · ticket credential not configured"
- takeScreenshot: 20-room-event-relay

appId: life.crays
---
- runFlow: 16-me.yaml
- scrollUntilVisible:
    element:
      id: "me-profile"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "me-profile"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible: "Saved in Crays"
- assertVisible: "Existing Nostr identity"
- assertVisible: "Not configured"
- assertVisible: "Presence defaults"
- takeScreenshot: profile-settings

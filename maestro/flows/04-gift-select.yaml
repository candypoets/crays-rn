appId: life.crays
---
- runFlow: seed-and-join.yaml
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "messages-screen"
    timeout: 15000
- extendedWaitUntil:
    visible: "Want to hear the second set?"
    timeout: 15000
- tapOn:
    text: "Jonas"
    index: 0
- extendedWaitUntil:
    visible:
      id: "conversation-screen"
    timeout: 15000
- tapOn:
    id: "conversation-accept"
- extendedWaitUntil:
    visible: "Conversation · accepted"
    timeout: 15000
- tapOn:
    id: "conversation-back"
- tapOn:
    id: "tab-room"
- tapOn:
    id: "room-people-tab"
- tapOn: "Jonas"
- extendedWaitUntil:
    visible:
      id: "first-contact-screen"
    timeout: 15000
- tapOn:
    id: "send-drink-person"
- extendedWaitUntil:
    visible:
      id: "gift-select-screen"
    timeout: 15000
- assertVisible: "The gift is from you. The bar gets the order. Jonas gets the ticket and can decline before fulfillment."
- extendedWaitUntil:
    visible: "Mezcal Negroni"
    timeout: 15000
- assertVisible: "Rooftop Lager"
- assertNotVisible: "Marinated olives"
- takeScreenshot: 04-gift-select-relay

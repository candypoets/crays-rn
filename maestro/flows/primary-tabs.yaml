appId: life.crays
---
- runFlow: seed-and-join.yaml
- tapOn:
    id: "room-feed-tab"
- extendedWaitUntil:
    visible:
      id: "room-feed-screen"
    timeout: 15000
- tapOn:
    id: "tab-discover"
- extendedWaitUntil:
    visible:
      id: "discover-screen"
    timeout: 15000
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      id: "messages-screen"
    timeout: 15000
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "me-screen"
    timeout: 15000
- tapOn:
    id: "tab-room"
- extendedWaitUntil:
    visible:
      id: "room-feed-screen"
    timeout: 15000
- tapOn:
    id: "room-menu"
- extendedWaitUntil:
    visible:
      id: "room-menu-screen"
    timeout: 15000
- assertVisible:
    id: "tab-room"
- assertVisible:
    id: "tab-me"
- assertVisible: "^Discover$"
- assertVisible: "^Messages$"
- assertVisible: "^Me$"
- takeScreenshot: primary-tabs

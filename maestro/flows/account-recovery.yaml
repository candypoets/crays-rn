appId: life.crays
---
- runFlow: launch.yaml
- tapOn:
    id: "log-in-button"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- assertVisible: "Log in with Nostr"
- tapOn:
    id: "login-existing-identity"
- extendedWaitUntil:
    visible:
      id: "account-recovery-screen"
    timeout: 15000
- assertVisible: "Use your Nostr identity"
- assertVisible: "Recommended"
- assertVisible: "Connect a signer"
- assertVisible: "Import a secret key"
- tapOn:
    id: "nostr-connect-method"
- extendedWaitUntil:
    visible:
      id: "nostr-connect-qr"
    timeout: 30000
- assertVisible: "Connect your signer"
- assertVisible: ".*Waiting for approval in your signer.*"
- takeScreenshot: nostr-connect-waiting
- tapOn:
    id: "back-button"
- tapOn:
    id: "secret-import-method"
- assertVisible: "Import a secret key"
- tapOn:
    id: "nsec-input"
- inputText: "${QA_NSEC}"
- hideKeyboard
- tapOn:
    id: "import-secret-button"
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000
- assertVisible: "What should people here call you?"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "profile-setup-screen"
    timeout: 30000

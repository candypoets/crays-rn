appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///qa-seed?nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "qa-seed-continue"
    timeout: 30000
- tapOn:
    id: "qa-seed-continue"
- openLink: "crays:///login"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- tapOn:
    id: "login-other-ways"
- extendedWaitUntil:
    visible:
      id: "account-recovery-screen"
    timeout: 15000
- assertVisible: "Key import, remote signer, and provider recovery are not configured.*"
- assertVisible: ".*No local identity will be overwritten.*"
- takeScreenshot: account-recovery-unconfigured
- tapOn: "Back to login"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- assertVisible: "Unlock on this device"
- tapOn:
    id: "login-device-unlock"
- extendedWaitUntil:
    visible:
      id: "discover-screen"
    timeout: 30000

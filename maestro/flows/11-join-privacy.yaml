appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///join-room?relay=${RELAY_URL}&room=${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "The Skyline Room"
    timeout: 45000
- assertVisible: "Browse quietly"
- assertVisible: ".*No presence event is published.*"
- tapOn:
    id: "visibility-visible"
# The enter button moves below the fold once the visible-only fields expand.
- scrollUntilVisible:
    element:
      text: "Enter room"
    direction: DOWN
- assertVisible: "Enter room"
- tapOn:
    id: "visibility-quiet"
- assertVisible: "Enter room"
- takeScreenshot: 11-join-privacy

appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///join-room?relay=${RELAY_URL}&room=${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "The Skyline Room"
    timeout: 45000
- extendedWaitUntil:
    visible: "Browse quietly"
    timeout: 15000
- tapOn:
    id: "visibility-quiet"
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Maya"
    timeout: 15000
- assertVisible: "People here (3)"
- assertVisible: "^People$"
- assertVisible: "Connected"
- assertVisible: "Invite a friend"
- assertNotVisible: "Room moment"
- assertNotVisible: "${QA_ROOM_ABOUT}"
- assertVisible: "^Tonight$"
- assertVisible: "^Messages$"
- assertVisible: "^Me$"
- takeScreenshot: 01-people-edge-to-edge
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "People here (3)"
    timeout: 15000
- assertVisible: "Maya"
- assertVisible: "Jonas"
- tapOn:
    id: "room-feed-tab"
- extendedWaitUntil:
    visible: "The mezcal negroni is excellent."
    timeout: 15000
- assertVisible: "Connected"
- takeScreenshot: 01-people-cold-resume

appId: life.crays
---
- runFlow: launch.yaml
- openLink: "crays:///join-room?relay=${RELAY_URL}&room=${ROOM_ID}"
- extendedWaitUntil:
    visible:
      id: "join-privacy-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Enter quietly"
    timeout: 15000
- tapOn:
    id: "join-room-button"
- extendedWaitUntil:
    visible:
      id: "room-people-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "Maya"
    timeout: 15000
- assertVisible: "3 visible · no distance or ranking"
- assertVisible: "Connected in the room"
- takeScreenshot: 01-people-relay

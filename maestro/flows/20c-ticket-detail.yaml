appId: life.crays
---
- runFlow: seed-and-join.yaml
- openLink: "crays:///ticket?awardId=${EVENT_ACCESS_AWARD_ID}"
- extendedWaitUntil:
    visible:
      id: "ticket-detail-screen"
    timeout: 15000
- assertVisible: "Ready to show"
- assertNotVisible: "Ready · relay issued"
- scrollUntilVisible:
    element:
      id: "entitlement-presentation"
    direction: DOWN
- assertVisible:
    id: "entitlement-presentation"
- assertVisible: "Live code · refreshes automatically · tap to enlarge"
- assertVisible: ".*refreshes automatically and is signed for you.*"
- assertVisible: ".*Staff checks your ticket.*"
- takeScreenshot: 20c-ticket-detail-relay
